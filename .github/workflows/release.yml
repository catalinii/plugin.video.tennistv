name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get base version
        id: base
        run: echo "base=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("addon.xml").getroot().get("version"))')" >> $GITHUB_OUTPUT

      - name: Determine next tag
        id: tag
        run: |
          BASE="${{ steps.base.outputs.base }}"
          git fetch --tags --quiet
          LATEST=$(git tag --list "v${BASE}.*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v${BASE}.1"
          else
            NUM=$(echo "$LATEST" | grep -oE '[0-9]+$')
            NEXT="v${BASE}.$((NUM + 1))"
          fi
          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT (base $BASE, latest $LATEST)"

      - name: Build zip
        run: ./pack.sh && ls -lh *.zip

      - name: Create tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: plugin.video.tennistv.zip
